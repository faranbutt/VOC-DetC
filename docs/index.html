<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViSC-Bench Leaderboard</title>
    <style>
        :root {
            --bg: #0b0f17;
            --panel: #101827;
            --text: #e6edf3;
            --muted: #9fb0c0;
            --border: #223047;
            --accent: #7aa2f7;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: var(--muted);
            margin-bottom: 30px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: rgba(122, 162, 247, 0.05);
        }
        .rank {
            color: var(--accent);
            font-weight: bold;
        }
        .score {
            font-weight: bold;
            color: #3fb950;
        }
        .model-badge {
            background: #1f2937;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        #loading {
            color: var(--muted);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ViSC-Bench Leaderboard</h1>
        <p class="subtitle">Corruption-Robust Grape Instance Segmentation Benchmark</p>

        <div class="card">
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Team</th>
                        <th>AP (IoU 0.50:0.95)</th>
                        <th>AP50</th>
                        <th>AP75</th>
                        <th>Model</th>
                        <th>Date (UTC)</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="7" id="loading">Loading leaderboard data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fetch the CSV from the leaderboard folder
        async function loadLeaderboard() {
            try {
                // The path goes up one level from /docs/ to find /leaderboard/
                const response = await fetch('../leaderboard/leaderboard.csv');
                if (!response.ok) throw new Error('CSV not found');
                
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                renderTable(rows);
            } catch (error) {
                document.getElementById('loading').innerText = "Leaderboard is empty or could not be loaded.";
                console.error(error);
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            if (lines.length < 2) return [];
            
            const headers = lines[0].split(',');
            const results = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                // Simple split by comma (assuming notes don't have commas for now)
                const values = lines[i].split(',');
                const row = {};
                headers.forEach((header, index) => {
                    row[header.trim()] = (values[index] || "").trim();
                });
                results.push(row);
            }
            return results;
        }

        function renderTable(data) {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No submissions yet. Be the first!</td></tr>';
                return;
            }

            // Sort by AP descending
            data.sort((a, b) => parseFloat(b.AP) - parseFloat(a.AP));

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="rank">${index + 1}</td>
                    <td><strong>${row.team}</strong></td>
                    <td class="score">${parseFloat(row.AP).toFixed(4)}</td>
                    <td>${parseFloat(row.AP50).toFixed(4)}</td>
                    <td>${parseFloat(row.AP75).toFixed(4)}</td>
                    <td><span class="model-badge">${row.model || 'N/A'}</span></td>
                    <td>${row.timestamp_utc || 'N/A'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Load on page load
        loadLeaderboard();
    </script>
</body>
</html>
